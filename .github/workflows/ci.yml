name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_EMULATOR_TARGET: google_apis
  ANDROID_EMULATOR_ARCH: x86_64

jobs:
  check-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_COMPILE_SDK}"
          test -d "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Android preflight and static policy checks
        run: scripts/verify_android.sh preflight

      - name: Android unit and architecture tests
        run: scripts/verify_android.sh unit

      - name: Upload Android unit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unit-test-reports
          path: |
            android/**/build/test-results/**/*.xml
            android/**/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

      - name: Android release lint
        run: scripts/verify_android.sh lint

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-reports
          path: |
            android/**/build/reports/lint-results-*.html
            android/**/build/reports/lint-results-*.xml
            android/**/build/reports/lint-results-*.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble Android APKs
        run: scripts/verify_android.sh assemble

      - name: Generate Android engineering metrics
        run: scripts/verify_android.sh metrics

      - name: Upload Android engineering metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-engineering-metrics
          path: android/build/reports/engineering-metrics/engineering-metrics.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apks
          path: android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  test-android-emulator:
    name: Android device tests (API ${{ matrix.api_level }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api_level: [26, 33, 35, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android SDK and emulator image
        shell: bash
        run: |
          emulator_image="system-images;android-${{ matrix.api_level }};${ANDROID_EMULATOR_TARGET};${ANDROID_EMULATOR_ARCH}"
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "${emulator_image}"
          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_COMPILE_SDK}"
          test -d "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"
          sdkmanager --list_installed | grep -F "${emulator_image}"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Enable hardware acceleration for the Android emulator
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api_level }}
          target: ${{ env.ANDROID_EMULATOR_TARGET }}
          arch: ${{ env.ANDROID_EMULATOR_ARCH }}
          profile: pixel_6
          disable-animations: true
          script: scripts/verify_android.sh instrumentation

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumentation-api-${{ matrix.api_level }}
          path: |
            android/**/build/outputs/androidTest-results/**
            android/**/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 14

  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src/
      - run: npx prettier --check src/
      - run: npx vitest run

  check-offline-asr-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install benchmark dependencies from pinned requirements
        run: |
          python3 -m venv /tmp/opentypeless-asr-ci
          /tmp/opentypeless-asr-ci/bin/python -m pip install --disable-pip-version-check \
            -r benchmarks/offline_asr/requirements.txt

      - name: Test offline ASR corpus, metrics, and adapters
        run: |
          /tmp/opentypeless-asr-ci/bin/python -m unittest discover \
            -s benchmarks/offline_asr -p 'test_*.py' -v
          /tmp/opentypeless-asr-ci/bin/python -m py_compile benchmarks/offline_asr/*.py
          for report in benchmarks/offline_asr/reports/*.json; do
            /tmp/opentypeless-asr-ci/bin/python -m json.tool "$report" >/dev/null
          done

  check-rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            platform_group: windows
            target: x86_64-pc-windows-msvc
            python: python
          - platform: macos-latest
            platform_group: macos
            target: aarch64-apple-darwin
            python: python3
          - platform: ubuntu-latest
            platform_group: linux
            target: x86_64-unknown-linux-gnu
            python: python3
          - platform: ubuntu-22.04-arm
            platform_group: linux
            target: aarch64-unknown-linux-gnu
            python: python3

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Verify dependency inventory on the release build host
        run: ${{ matrix.python }} scripts/generate_third_party_inventory.py --check-inventory

      - name: Install Linux dependencies
        if: matrix.platform_group == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev

      - name: Verify bundled Opus build tool
        run: cmake --version

      - name: Test Linux AppImage packaging guards
        if: matrix.platform_group == 'linux'
        run: ./.github/scripts/test-linux-appimage-packaging.sh

      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Run Rust tests
        run: cargo test --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - run: npm audit --audit-level=high

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - run: npm ci

      - name: Install pinned cargo-about
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Fetch locked Cargo sources for offline license extraction
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Verify third-party inventory and complete license material
        run: |
          test ! -e src/assets/app-icons/reference
          node -e "const c=require('./src-tauri/tauri.conf.json'); if (c.bundle?.createUpdaterArtifacts !== false) process.exit(1)"
          updater_key="$(printf '%s%s' TAURI_SIGNING_PRIVATE _KEY)"
          updater_sign="$(printf '%s%s' 'tauri signer ' sign)"
          updater_manifest="$(printf '%s%s' latest .json)"
          if grep -R -n -E "${updater_key}|${updater_sign}|${updater_manifest}" \
            .github/workflows .github/scripts/publish-signpath-windows-release.ps1; then
            echo 'Updater-only release logic is forbidden while createUpdaterArtifacts is false.' >&2
            exit 1
          fi
          python3 scripts/generate_third_party_inventory.py --check

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # wayland-scanner 0.31.10 is currently the latest release and still pins
      # quick-xml 0.39 for Wayland protocol code generation. The vulnerable XML
      # parser path is not used for runtime user input; remove these ignores once
      # wayland-scanner publishes a quick-xml >=0.41 compatible release.
      - run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
