name: Staple macOS Release DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag containing the notarized DMG, e.g. v1.2.0'
        required: true
      submission_id:
        description: 'Accepted Apple notarization submission ID for that DMG'
        required: true

permissions:
  contents: read

jobs:
  staple:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Verify secrets and DMG notarization status
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SUBMISSION_ID: ${{ github.event.inputs.submission_id }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in RELEASE_TOKEN SUBMISSION_ID APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required."
              exit 1
            fi
          done

          xcrun notarytool info "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" | tee notary-info.txt

          if ! grep -q "status: Accepted" notary-info.txt; then
            echo "::error::DMG notarization submission is not Accepted yet."
            exit 1
          fi

      - name: Download, staple, verify, and replace the macOS DMG
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          DMG_NAME="OpenTypeless_${VERSION}_universal.dmg"
          WORK_DIR="$RUNNER_TEMP/staple-macos"
          mkdir -p "$WORK_DIR"

          gh release download "$TAG" \
            --repo dengxuezhao/opentypeless \
            --pattern "$DMG_NAME" \
            --dir "$WORK_DIR"

          test -f "$WORK_DIR/$DMG_NAME"
          xcrun stapler staple "$WORK_DIR/$DMG_NAME"
          xcrun stapler validate "$WORK_DIR/$DMG_NAME"
          spctl --assess --type open --context context:primary-signature --verbose=4 \
            "$WORK_DIR/$DMG_NAME"

          gh release upload "$TAG" "$WORK_DIR/$DMG_NAME" \
            --repo dengxuezhao/opentypeless \
            --clobber
