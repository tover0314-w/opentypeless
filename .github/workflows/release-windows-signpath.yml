name: Release Windows SignPath

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'
      publish_release:
        description: 'Publish signed assets to GitHub Releases'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  actions: read
  contents: read

jobs:
  verify-release-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: Fetch protected main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Verify release tag is on protected main
        env:
          TAG_NAME: ${{ github.event.inputs.tag }}
        run: python3 scripts/verify_release_source.py --repo-root . --tag "$TAG_NAME"

  build-sign-publish:
    needs: verify-release-source
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag }}

      - name: Sync version from tag
        shell: bash
        run: |
          TAG_VERSION="${{ github.event.inputs.tag }}"
          VERSION="${TAG_VERSION#v}"
          echo "TAG_NAME=$TAG_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=v$VERSION" >> "$GITHUB_ENV"

          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));c.version='$VERSION';fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(c,null,2)+'\n');"
          node -e "const fs=require('fs');let c=fs.readFileSync('src-tauri/Cargo.toml','utf8');c=c.replace(/^version = \".*\"/m,'version = \"$VERSION\"');fs.writeFileSync('src-tauri/Cargo.toml',c);"

      - name: Verify secrets
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG'
          )
          if ($env:PUBLISH_RELEASE -eq 'true') {
            $required += 'RELEASE_TOKEN'
          }
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Error "$name is required for Windows SignPath release."
              exit 1
            }
          }

          $isTestSigning = $env:SIGNPATH_SIGNING_POLICY_SLUG -match '^(?i:test[-_])'
          if ($env:PUBLISH_RELEASE -eq 'true' -and $isTestSigning) {
            Write-Error 'A SignPath test policy cannot publish Windows assets to a production GitHub Release.'
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Verify bundled Opus build tool
        run: cmake --version

      - run: npm ci

      - name: Build unsigned Windows installers
        shell: pwsh
        run: npx tauri build --target x86_64-pc-windows-msvc --no-sign --ci

      - name: Stage unsigned installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signpath-unsigned | Out-Null
          $installers = Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' }
          if ($installers.Count -lt 2) {
            Write-Error "Expected NSIS and MSI installers, found $($installers.Count)."
            exit 1
          }
          foreach ($installer in $installers) {
            Copy-Item -LiteralPath $installer.FullName -Destination signpath-unsigned
          }
          Get-ChildItem signpath-unsigned

      - name: Upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentypeless-windows-unsigned-${{ github.event.inputs.tag }}
          path: signpath-unsigned/*
          if-no-files-found: error

      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '1800'
          output-artifact-directory: signpath-signed

      - name: Verify Authenticode signatures
        shell: pwsh
        env:
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
        run: |
          $signed = Get-ChildItem -Path signpath-signed -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' }
          if ($signed.Count -lt 2) {
            Write-Error "Expected signed NSIS and MSI installers, found $($signed.Count)."
            exit 1
          }

          $isTestSigning = $env:SIGNPATH_SIGNING_POLICY_SLUG -match '^(?i:test[-_])'
          if ($env:PUBLISH_RELEASE -eq 'true' -and $isTestSigning) {
            Write-Error 'Refusing to publish installers signed with a SignPath test certificate.'
            exit 1
          }
          foreach ($file in $signed) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($isTestSigning) {
              if (-not $signature.SignerCertificate) {
                Write-Error "Missing Authenticode signature for $($file.Name): $($signature.Status)"
                exit 1
              }
            } elseif ($signature.Status -ne 'Valid') {
              Write-Error "Invalid Authenticode signature for $($file.Name): $($signature.Status)"
              exit 1
            }
            Write-Host "$($file.Name): $($signature.Status); $($signature.SignerCertificate.Subject)"
          }

      - name: Publish signed Windows release assets
        if: ${{ github.event.inputs.publish_release == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag }}
          RELEASE_REPO: dengxuezhao/opentypeless
        run: ./.github/scripts/publish-signpath-windows-release.ps1
